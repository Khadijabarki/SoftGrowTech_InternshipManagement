<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Internship Portal</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-container">

        <!-- Animated Background Blobs -->
        <div class="auth-blob auth-blob-1"></div>
        <div class="auth-blob auth-blob-2"></div>
        <div class="auth-blob auth-blob-3"></div>
        <div class="auth-blob auth-blob-4"></div>


        <!-- Floating Particles (generated via inline style for variety) -->
        <div class="auth-particles" id="auth-particles"></div>

        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                </div>
                <h1 class="auth-title">Internship Portal</h1>
                <p class="auth-subtitle">Manage assignments, task submissions & mentor reviews</p>
            </div>

            <!-- Role Selector Switch -->
            <div class="role-switch-container" id="role-switch">
                <button type="button" class="role-switch-btn active" data-role="intern">
                    👨‍💻 Intern Portal
                </button>
                <button type="button" class="role-switch-btn" data-role="admin">
                    👑 Admin Mentor
                </button>
            </div>

            <!-- Auth Tabs (Login / Register) -->
            <div class="auth-tabs">
                <button type="button" class="tab-btn active" id="tab-login-btn">Sign In</button>
                <button type="button" class="tab-btn" id="tab-register-btn">Create Account</button>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="password-toggle" data-target="login-password" aria-label="Toggle password visibility">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    Sign In as <span id="login-role-label">Intern</span>
                </button>
            </form>

            <!-- Registration Form (Hidden by default) -->
            <form id="register-form" style="display: none;">
                <div class="form-group">
                    <label class="form-label" for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="e.g. Alex Morgan" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-dept" id="reg-dept-label">Department / Track</label>
                    <input type="text" id="reg-dept" class="form-control" placeholder="e.g. Software Engineering" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reg-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6">
                        <button type="button" class="password-toggle" data-target="reg-password" aria-label="Toggle password visibility">
                            <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    Register as <span id="reg-role-label">Intern</span>
                </button>
            </form>

            <!-- Quick Demo Credentials Box -->
            <div class="demo-logins">
                <div class="demo-title">Fast Demo Access</div>
                <div class="demo-buttons">
                    <button type="button" class="demo-btn" id="demo-intern-btn">
                        ⚡ Quick Intern Login
                    </button>
                    <button type="button" class="demo-btn" id="demo-admin-btn">
                        ⚡ Quick Admin Login
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Theme Toggle Floating Button -->
    <button class="btn-icon theme-toggle-btn" style="position: fixed; bottom: 1.5rem; left: 1.5rem; z-index: 100;" title="Toggle Theme">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
